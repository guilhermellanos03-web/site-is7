  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "Portfólio de Google Meu Negócio da IS7 Marketing Digital",

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'"/>

<!-- Anti-flash: apply saved theme before React mounts -->
<script>(function(){ var t=localStorage.getItem('is7-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })()</script>
<style>
  .gmn-hero{ position:relative; overflow:hidden; padding:140px 0 56px; text-align:center; }

  /* alternador Sites | Google (aparece nas duas paginas de portfolio) */
  .port-switch{ display:inline-flex; gap:6px; background:var(--surface); border:1px solid var(--line-2); border-radius:9999px; padding:5px; margin-bottom:26px; }
  .port-switch a{ font-size:13.5px; font-weight:600; padding:9px 18px; border-radius:9999px; color:var(--fg-muted); transition:color .2s, background .2s; }
  .port-switch a.on{ background:var(--grad); color:#fff; }
  .port-switch a:not(.on):hover{ color:var(--fg); }

  .gmn-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
  .gmn-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .gmn-card:hover{ transform:translateY(-6px); border-color:rgba(59,108,255,.45); box-shadow:0 24px 50px -22px rgba(45,110,240,.45); }

  .gmn-head{ padding:20px 22px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .gmn-nicho{ margin:0; font-family:var(--serif); font-weight:700; font-size:18px; }
  .gmn-meta{ margin:4px 0 0; font-size:12.5px; color:var(--fg-dim); }

  .gmn-stats{ display:flex; gap:28px; padding:16px 22px 4px; }
  .gmn-stat .n{ font-family:var(--serif); font-weight:700; font-size:26px; letter-spacing:-.02em; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; display:block; }
  .gmn-stat .l{ font-size:11.5px; color:var(--fg-muted); line-height:1.45; display:block; max-width:150px; margin-top:3px; }

  .gmn-termos{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 22px 16px; }

  /* o print: a prova. clique abre no lightbox */
  .gmn-shot{ position:relative; border-top:1px solid var(--line); background:#101010; }
  .gmn-shot img{ width:100%; height:auto; display:block; }
  .gmn-hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(7,10,20,.55); opacity:0; transition:opacity .25s; backdrop-filter:blur(2px);
  }
  .gmn-card:hover .gmn-hint{ opacity:1; }

  .gmn-nota{ text-align:center; margin-top:34px; font-size:13px; color:var(--fg-dim); }

  @media(max-width:820px){ .gmn-grid{ grid-template-columns:1fr; gap:18px; } .gmn-hero{ padding:120px 0 44px; } }

  [data-theme="light"] .gmn-card{ box-shadow:0 2px 14px rgba(0,0,0,.07); }
  [data-theme="light"] .gmn-card:hover{ box-shadow:0 24px 50px -22px rgba(30,79,216,.20); }
  [data-theme="light"] .gmn-shot{ background:#0d0d0d; }
</style>
</head>
<body class="js-anim" data-screen-label="IS7 — Portfólio Google Meu Negócio">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="site_v2/consent.js"></script>
  <script type="text/babel" src="site_v2/SiteCore.jsx"></script>
  <script type="text/babel" src="site_v2/PortfolioLightbox.jsx"></script>

  <script type="text/babel">
    const { Logo, Icon, Eyebrow, Reveal, wa } = window.IS7v2;

    /* Prints reais do painel "Desempenho" do Perfil da Empresa no Google.
       Sem nome de cliente no titulo por decisao do Guilherme (26/07/2026):
       identificamos so o nicho. Os numeros abaixo sao os que aparecem em
       cada print — nada alem do que da pra conferir na propria imagem. */
    const GMN = [
      {
        name: "Mecânica",
        meta: "Porto Alegre/RS",
        tag: "Perfil da Empresa",
        img: "assets/gmn/mecanica-porto-alegre.webp",
        views: "6.350",
        buscas: "279",
        termos: ["mecanica", "mecanica porto alegre", "auto elétrica"],
        delivered: ["6.350 visualizações do perfil", "79% das descobertas pelo celular", "Perfil aparecendo até para buscas de auto elétrica"],
      },
      {
        name: "Chaveiro 24h",
        meta: "Recife/PE",
        tag: "Perfil da Empresa",
        img: "assets/gmn/chaveiro-recife.webp",
        views: "5.021",
        buscas: "1.636",
        termos: ["chaveiro", "chaveiro recife", "chaveiro 24 horas"],
        delivered: ["5.021 visualizações em 6 meses (fev–jul/2026)", "1.636 pesquisas mostraram o perfil", "83% das descobertas pelo celular, na hora do aperto"],
      },
      {
        name: "Nutricionista",
        meta: "Curitiba/PR",
        tag: "Perfil da Empresa",
        img: "assets/gmn/nutricionista-curitiba.webp",
        views: "1.079",
        buscas: "171",
        termos: ["nutricionista unimed", "nutricionista curitiba", "nutricionista cajuru"],
        delivered: ["1.079 visualizações do perfil", "Aparece para quem busca pelo convênio (unimed)", "Posicionada no bairro (cajuru) e na cidade"],
      },
      {
        name: "Estética automotiva",
        meta: "São José dos Pinhais/PR",
        tag: "Perfil da Empresa",
        img: "assets/gmn/estetica-automotiva.webp",
        views: "944",
        buscas: "16+",
        termos: ["lava car", "lava car perto de mim", "car wash near me"],
        delivered: ["944 visualizações do perfil", "75% das descobertas pelo celular", "Aparece no “perto de mim”, inclusive em inglês"],
      },
      {
        name: "Loja virtual de moda",
        meta: "Curitiba/PR",
        tag: "Perfil da Empresa",
        img: "assets/gmn/loja-virtual-moda.webp",
        views: "296",
        buscas: "64",
        termos: ["marca pesquisada pelo nome"],
        delivered: ["296 visualizações do perfil", "Clientes já pesquisam a marca pelo nome próprio", "Perfil ativo mesmo sem loja física de rua"],
      },
    ];

    const GmnCard = ({ g, i, onOpen }) => (
      <Reveal delay={(i % 2) * 80} as="article" className="gmn-card" onClick={() => onOpen(g)}>
        <div className="gmn-head">
          <div>
            <p className="gmn-nicho">{g.name}</p>
            <p className="gmn-meta">{g.meta}</p>
          </div>
          <span className="tag tag-accent" style={{ fontSize: 10, flexShrink: 0 }}>Google</span>
        </div>
        <div className="gmn-stats">
          <div className="gmn-stat"><span className="n">{g.views}</span><span className="l">pessoas viram o perfil</span></div>
          <div className="gmn-stat"><span className="n">{g.buscas}</span><span className="l">pesquisas mostraram a empresa</span></div>
        </div>
        <div className="gmn-termos">
          {g.termos.map((t, j) => <span key={j} className="tag" style={{ fontSize: 10, padding: "3px 9px", textTransform: "none", letterSpacing: 0 }}>{t}</span>)}
        </div>
        <div className="gmn-shot">
          <img src={g.img} alt={`Painel do Perfil da Empresa no Google — ${g.name}`} loading="lazy" />
          <div className="gmn-hint">
            <span style={{ display: "flex", alignItems: "center", gap: 8, background: "var(--grad)", padding: "10px 18px", borderRadius: 9999, fontSize: 13.5, fontWeight: 600, color: "#fff" }}>
              <Icon name="search" size={15} /> Ver print completo
            </span>
          </div>
        </div>
      </Reveal>
    );

    const App = () => {
      const [scrolled, setScrolled] = React.useState(false);
      const [theme, setTheme] = React.useState(() =>
        typeof localStorage !== 'undefined' ? (localStorage.getItem('is7-theme') || 'dark') : 'dark'
      );

      React.useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 16);
        fn(); window.addEventListener('scroll', fn, { passive: true });
        return () => window.removeEventListener('scroll', fn);
      }, []);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('is7-theme', theme);
      }, [theme]);

      const { useLightbox, PortfolioLightbox } = window.IS7v2;
      const [active, setActive] = useLightbox();

      return (
        <React.Fragment>
          {/* Header */}
          <header className={`hdr ${scrolled ? "scrolled" : ""}`}>
            <div className="wrap hdr-row">
              <a href="/" aria-label="IS7"><Logo size={26} /></a>
              <nav className="nav">
                <a href="/">Início</a>
                <a href="/portfolio">Sites</a>
                <a href="/#sobre">Sobre</a>
                <a href="/#contato">Contato</a>
              </nav>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <button className="theme-toggle" aria-label="Alternar tema"
                  onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}>
                  <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={17} />
                </button>
                <a href={wa("Olá! Vi os resultados de Google Meu Negócio da IS7 e quero isso pra minha empresa.")} target="_blank" rel="noreferrer" className="btn btn-primary" style={{ padding: "12px 24px", fontSize: 14 }}>
                  Fale conosco
                </a>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section className="gmn-hero">
            <div className="glow glow-purple" style={{ width: 500, height: 500, top: -200, left: "50%", transform: "translateX(-50%)", animation: "glow-morph 12s ease-in-out infinite" }} />
            <div className="wrap" style={{ position: "relative", zIndex: 2 }}>
              <Reveal>
                <div className="port-switch">
                  <a href="/portfolio">Sites</a>
                  <a href="/google-meu-negocio" className="on">Google Meu Negócio</a>
                </div>
              </Reveal>
              <Reveal delay={60}>
                <h1 className="display" style={{ maxWidth: 720, margin: "0 auto" }}>
                  Empresas aparecendo no Google, <span className="grad-text">com print do painel</span>.
                </h1>
              </Reveal>
              <Reveal delay={120}>
                <p className="lead" style={{ maxWidth: 600, margin: "20px auto 0" }}>
                  Cada card abaixo é a tela real de desempenho do Perfil da Empresa no Google
                  de um cliente da IS7: quantas pessoas viram, o que pesquisaram e por onde chegaram.
                </p>
              </Reveal>
            </div>
          </section>

          {/* Grid */}
          <section style={{ paddingBottom: 80 }}>
            <div className="wrap">
              <div className="gmn-grid">
                {GMN.map((g, i) => <GmnCard key={g.name} g={g} i={i} onOpen={setActive} />)}
              </div>
              <Reveal className="gmn-nota">
                Prints do painel oficial do Google (seção Desempenho). Nichos identificados sem o nome
                do cliente por privacidade — no diagnóstico a gente mostra como chegar lá no seu.
              </Reveal>
            </div>
          </section>

          {/* CTA */}
          <section className="port-cta" style={{ marginTop: 40, padding: "64px 0", textAlign: "center", position: "relative", background: "linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%)", borderTop: "1px solid var(--line)" }}>
            <div className="glow glow-blue" style={{ width: 400, height: 400, top: -120, left: "50%", transform: "translateX(-50%)", opacity: .35 }} />
            <div className="wrap" style={{ position: "relative", zIndex: 2 }}>
              <Reveal>
                <Eyebrow center>Quer aparecer assim?</Eyebrow>
                <h2 className="h2" style={{ marginTop: 16 }}>Seu perfil no Google pode ser o <span className="grad-text">próximo painel</span>.</h2>
                <p className="lead" style={{ maxWidth: 520, margin: "18px auto 0" }}>
                  Diagnóstico gratuito: a gente olha seu Perfil da Empresa e te mostra o que está travando suas visualizações.
                </p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 14, justifyContent: "center", marginTop: 32 }}>
                  <a href={wa("Olá! Quero um diagnóstico gratuito do meu Perfil da Empresa no Google.")} target="_blank" rel="noreferrer" className="btn btn-primary btn-lg">
                    Quero meu diagnóstico <Icon name="arrow-right" size={18} />
                  </a>
                  <a href="/portfolio" className="btn btn-ghost btn-lg">Ver portfólio de sites</a>
                </div>
              </Reveal>
            </div>
          </section>

          {/* Footer mini */}
          <footer style={{ borderTop: "1px solid var(--line)", padding: "28px 0", textAlign: "center" }}>
            <div className="wrap" style={{ display: "flex", flexWrap: "wrap", gap: 14, justifyContent: "space-between", alignItems: "center" }}>
              <Logo size={22} />
              <p style={{ margin: 0, fontSize: 12, color: "var(--fg-dim)" }}>© 2026 IS7 · Todos os direitos reservados</p>
            </div>
          </footer>

          {/* Lightbox (mostra o print inteiro; rodape lista os destaques) */}
          {active && <PortfolioLightbox c={active} onClose={() => setActive(null)} />}

          {/* WhatsApp FAB */}
          <a className="fab" href={wa("Olá! Vi os resultados de Google Meu Negócio da IS7 e quero saber mais.")} target="_blank" rel="noreferrer" aria-label="WhatsApp">
            <svg viewBox="0 0 32 32" style={{ width: 30, height: 30, fill: "#04210F" }}><path d="M16.004 0h-.008C7.174 0 .002 7.174.002 16c0 3.5 1.128 6.744 3.046 9.378L1.058 31.116l5.944-1.91A15.91 15.91 0 0 0 16.004 32C24.826 32 32 24.826 32 16S24.826 0 16.004 0zm9.314 22.594c-.39 1.1-1.932 2.014-3.168 2.282-.846.18-1.95.324-5.668-1.218-4.76-1.972-7.822-6.8-8.06-7.116-.228-.316-1.916-2.554-1.916-4.872 0-2.318 1.214-3.456 1.644-3.928.39-.428 1.022-.624 1.63-.624.196 0 .372.01.53.018.468.02.702.048 1.012.784.386.918 1.326 3.236 1.442 3.472.118.236.236.55.078.866-.148.326-.278.53-.514.808-.236.278-.458.492-.694.792-.216.26-.46.538-.196.996.264.45 1.174 1.936 2.522 3.136 1.732 1.54 3.192 2.02 3.642 2.236.35.168.766.128 1.04-.168.348-.382.78-.998 1.218-1.606.314-.434.708-.49 1.098-.332.396.148 2.508 1.182 2.938 1.398.43.216.716.324.822.504.104.18.104 1.042-.286 2.142z"/></svg>
          </a>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
