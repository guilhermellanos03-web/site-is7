<style>
  .port-hero{ position:relative; overflow:hidden; padding:140px 0 64px; text-align:center; }
  /* alternador Sites | Google Meu Negocio (existe igual na outra pagina) */
  .port-switch{ display:inline-flex; gap:6px; background:var(--surface); border:1px solid var(--line-2); border-radius:9999px; padding:5px; margin-bottom:26px; }
  .port-switch a{ font-size:13.5px; font-weight:600; padding:9px 18px; border-radius:9999px; color:var(--fg-muted); transition:color .2s, background .2s; }
  .port-switch a.on{ background:var(--grad); color:#fff; }
  .port-switch a:not(.on):hover{ color:var(--fg); }
  .port-count{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:12.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent-bright);
    background:rgba(59,108,255,.10); border:1px solid rgba(59,108,255,.25);
    padding:8px 18px; border-radius:9999px; margin-bottom:22px;
  }

  /* ---- Barra de filtro ---- */
  .port-filter{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:40px; }
  .port-fbtn{
    font-family:var(--sans); font-size:14px; font-weight:600;
    padding:10px 20px; border-radius:9999px; cursor:pointer;
    background:transparent; border:1px solid var(--line-2); color:var(--fg-muted);
    transition:border-color .22s, color .22s, background .22s;
    min-height:44px;
  }
  .port-fbtn:hover{ border-color:var(--accent-bright); color:var(--fg); }
  .port-fbtn.on{ background:var(--grad); border-color:transparent; color:#fff; }
  .port-fbtn .n{ opacity:.65; margin-left:6px; font-family:var(--mono); font-size:12px; }

  /* ---- Grid ---- */
  .port-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .port-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .port-card:hover{
    transform:translateY(-6px); border-color:rgba(59,108,255,.45);
    box-shadow:0 24px 50px -22px rgba(45,110,240,.45);
  }

  /* barra de navegador — o domínio real à vista */
  .port-bar{
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:8px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .port-dots{ display:flex; gap:5px; flex-shrink:0; }
  .port-dots span{ width:10px; height:10px; border-radius:50%; display:block; }
  .port-url{
    flex:1; background:var(--bg-2); border-radius:6px; padding:4px 10px;
    font-size:10px; color:var(--fg-dim); font-family:var(--mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* screenshot com rolagem no hover (a página inteira, não só a dobra) */
  .port-thumb{ height:230px; overflow:hidden; position:relative; flex-shrink:0; }
  .port-img{
    position:absolute; top:0; left:0; width:100%; height:auto; display:block;
    transition:transform 5s linear;
  }
  @media (hover:hover){ .port-card:hover .port-img{ transform:translateY(calc(-100% + 230px)); } }
  .port-hover-hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(7,10,20,.55); opacity:0; transition:opacity .25s; backdrop-filter:blur(2px);
  }
  .port-card:hover .port-hover-hint{ opacity:1; }

  /* corpo do card */
  .port-body{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px; flex:1; border-top:1px solid var(--line); }
  .port-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .port-name{ margin:0; font-family:var(--serif); font-weight:700; font-size:17px; }
  .port-meta{ margin:4px 0 0; font-size:12.5px; color:var(--fg-dim); }
  .port-summary{ margin:0; font-size:13.5px; line-height:1.6; color:var(--fg-muted); flex:1; }
  .port-arrow{
    width:36px; height:36px; border-radius:9999px; border:1px solid var(--line-2);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    transition:background .25s, border-color .25s;
  }
  .port-card:hover .port-arrow{ background:var(--grad); border-color:transparent; }
  .port-tags{ display:flex; flex-wrap:wrap; gap:6px; }

  .port-empty{ text-align:center; padding:60px 0; color:var(--fg-muted); }

  /* ---- Bloco SEO / AEO / GEO ---- */
  .port-otim{ position:relative; padding:24px 0 8px; }
  .port-otim-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; align-items:start; }
  .port-otim-card{ padding:28px 26px; }
  .port-otim-sigla{
    display:inline-block; font-family:var(--mono); font-weight:700; font-size:13px;
    letter-spacing:.16em; color:var(--accent-bright);
    background:var(--grad-soft); border:1px solid var(--line-2);
    padding:7px 14px; border-radius:9999px;
  }
  .port-otim-lista{ list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .port-otim-lista li{ display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--fg-muted); line-height:1.5; }
  .port-otim-lista li svg{ margin-top:3px; flex-shrink:0; }
  @media(max-width:900px){ .port-otim-grid{ grid-template-columns:1fr; gap:16px; } }

  .port-cta{
    margin-top:80px; padding:64px 0; text-align:center; position:relative;
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    border-top:1px solid var(--line);
  }

  @media(max-width:900px){
    .port-grid{ grid-template-columns:repeat(2,1fr); gap:18px; }
    .port-hero{ padding:120px 0 52px; }
  }
  @media(max-width:580px){
    .port-grid{ grid-template-columns:1fr; gap:16px; }
    .port-thumb{ height:200px; }
    @media (hover:hover){ .port-card:hover .port-img{ transform:translateY(calc(-100% + 200px)); } }
    .port-filter{ gap:8px; }
    .port-fbtn{ padding:10px 15px; font-size:13px; }
  }

  /* light mode */
  [data-theme="light"] .port-card{ box-shadow:0 2px 14px rgba(0,0,0,.07); }
  [data-theme="light"] .port-card:hover{ box-shadow:0 24px 50px -22px rgba(30,79,216,.20); border-color:rgba(30,79,216,.4); }
  [data-theme="light"] .port-count{ background:rgba(30,79,216,.08); border-color:rgba(30,79,216,.22); }
</style>
</head>
<body class="js-anim" data-screen-label="IS7 — Portfólio completo">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="site_v2/cases.js"></script>
  <script src="site_v2/consent.js"></script>
  <script type="text/babel" src="site_v2/SiteCore.jsx"></script>
  <script type="text/babel" src="site_v2/PortfolioLightbox.jsx"></script>

  <script type="text/babel">
    const { Logo, Icon, Eyebrow, Reveal, wa, WAPP } = window.IS7v2;
    const CASES = window.IS7_CASES || [];

    /* Filtros montados a partir dos proprios dados: nunca desencontram do cases.js */
    const FILTERS = [
      { key: "all",  label: "Todos" },
      { key: "site", label: "Sites" },
      { key: "loja", label: "Lojas virtuais" },
    ].map(f => ({
      ...f,
      count: f.key === "all" ? CASES.length : CASES.filter(c => c.cat === f.key).length,
    })).filter(f => f.count > 0);

    const PortCard = ({ c, i, onOpen }) => (
      <Reveal delay={(i % 3) * 70} as="article" className="port-card" onClick={() => onOpen(c)}>
        {/* barra de navegador com o dominio real */}
        <div className="port-bar">
          <div className="port-dots">
            <span style={{ background: "#FF5F57" }} />
            <span style={{ background: "#FFBD2E" }} />
            <span style={{ background: "#28CA42" }} />
          </div>
          <div className="port-url">{c.domain || c.name}</div>
        </div>

        <div className="port-thumb" style={{ background: c.grad || "var(--surface-2)" }}>
          <img src={c.img} alt={`Site desenvolvido para ${c.name}`} loading="lazy" className="port-img" />
          <div className="port-hover-hint">
            <span style={{ display:"flex", alignItems:"center", gap:8, background:"var(--grad)", padding:"10px 18px", borderRadius:9999, fontSize:13.5, fontWeight:600, color:"#fff" }}>
              <Icon name="monitor" size={16} /> Ver projeto
            </span>
          </div>
        </div>

        <div className="port-body">
          <div className="port-head">
            <div>
              <p className="port-name">{c.name}</p>
              <p className="port-meta">{c.meta}</p>
            </div>
            <span className="port-arrow"><Icon name="arrow-up-right" size={16} color="var(--accent-bright)" /></span>
          </div>
          <p className="port-summary">{c.summary}</p>
          <div className="port-tags">
            <span className="tag tag-accent" style={{ fontSize: 10, padding: "3px 9px" }}>{c.tag}</span>
            {c.pages > 1 && <span className="tag" style={{ fontSize: 10, padding: "3px 9px" }}>{c.pages} páginas</span>}
          </div>
        </div>
      </Reveal>
    );

    const App = () => {
      const [scrolled, setScrolled] = React.useState(false);
      const [filter, setFilter] = React.useState("all");
      const [theme, setTheme] = React.useState(() =>
        typeof localStorage !== 'undefined' ? (localStorage.getItem('is7-theme') || 'dark') : 'dark'
      );

      React.useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 16);
        fn(); window.addEventListener('scroll', fn, { passive: true });
        return () => window.removeEventListener('scroll', fn);
      }, []);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('is7-theme', theme);
      }, [theme]);

      const { useLightbox, PortfolioLightbox } = window.IS7v2;
      const [active, setActive] = useLightbox();

      const shown = filter === "all" ? CASES : CASES.filter(c => c.cat === filter);

      return (
        <React.Fragment>
          {/* Header */}
          <header className={`hdr ${scrolled ? "scrolled" : ""}`}>
            <div className="wrap hdr-row">
              <a href="/" aria-label="IS7"><Logo size={26} /></a>
              <nav className="nav">
                <a href="/">Início</a>
                <a href="/#servicos">Serviços</a>
                <a href="/#sobre">Sobre</a>
                <a href="/#contato">Contato</a>
              </nav>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <button className="theme-toggle" aria-label="Alternar tema"
                  onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}>
                  <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={17} />
                </button>
                <a href={wa("Olá! Vi o portfólio da IS7 e quero um projeto assim também.")} target="_blank" rel="noreferrer" className="btn btn-primary" style={{ padding: "12px 24px", fontSize: 14 }}>
                  Fale conosco
                </a>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section className="port-hero">
            <div className="glow glow-purple" style={{ width: 500, height: 500, top: -200, left: "50%", transform: "translateX(-50%)", animation: "glow-morph 12s ease-in-out infinite" }} />
            <div className="wrap" style={{ position: "relative", zIndex: 2 }}>
              <Reveal>
                <div className="port-switch">
                  <a href="/portfolio" className="on">Sites</a>
                  <a href="/google-meu-negocio">Google Meu Negócio</a>
                </div>
              </Reveal>
              <Reveal delay={60}>
                <span className="port-count">
                  <Icon name="layers" size={14} /> {CASES.length} projetos selecionados · +100 entregues
                </span>
              </Reveal>
              <Reveal delay={100}>
                <h1 className="display" style={{ maxWidth: 720, margin: "0 auto" }}>
                  Site de verdade, <span className="grad-text">no ar</span>, com o domínio à vista.
                </h1>
              </Reveal>
              <Reveal delay={140}>
                <p className="lead" style={{ maxWidth: 620, margin: "22px auto 0" }}>
                  Nada de mockup genérico. Cada projeto abaixo é um cliente real, com a página
                  inteira aberta para você rolar e conferir antes de falar com a gente.
                </p>
              </Reveal>
            </div>
          </section>

          {/* Grid + filtro */}
          <section style={{ paddingBottom: 80 }}>
            <div className="wrap">
              <Reveal className="port-filter" role="group" aria-label="Filtrar projetos por tipo">
                {FILTERS.map(f => (
                  <button key={f.key}
                    className={`port-fbtn ${filter === f.key ? "on" : ""}`}
                    aria-pressed={filter === f.key}
                    onClick={() => setFilter(f.key)}>
                    {f.label}<span className="n">{f.count}</span>
                  </button>
                ))}
              </Reveal>

              <div className="port-grid">
                {shown.map((c, i) => <PortCard key={c.name} c={c} i={i} onOpen={setActive} />)}
              </div>

              {shown.length === 0 && (
                <p className="port-empty">Nenhum projeto nesta categoria por enquanto.</p>
              )}
            </div>
          </section>

          {/* Como os sites sao entregues: SEO + GEO + AEO */}
          <section className="port-otim">
            <div className="glow glow-purple" style={{ width: 420, height: 420, top: -140, left: "50%", transform: "translateX(-50%)", opacity: .3 }} />
            <div className="wrap" style={{ position: "relative", zIndex: 2 }}>
              <Reveal style={{ textAlign: "center", maxWidth: 720, margin: "0 auto 48px" }}>
                <Eyebrow center>Como cada projeto é entregue</Eyebrow>
                <h2 className="h2" style={{ marginTop: 16 }}>
                  Não basta ser bonito. <span className="grad-text">Tem que converter</span>.
                </h2>
                <p className="lead" style={{ marginTop: 18 }}>
                  E converter começa por ser achado. Hoje seu cliente não procura só no Google —
                  ele pergunta pro ChatGPT, pro Gemini e pra busca com IA. Todo site que sai daqui
                  é preparado para as três frentes, e desenhado para transformar visita em contato.
                </p>
              </Reveal>

              <div className="port-otim-grid">
                {[
                  {
                    sigla: "SEO",
                    nome: "Otimização para buscadores",
                    desc: "O básico bem feito, que é onde a maioria falha: título e descrição de cada página, endereço limpo, imagem leve, site rápido no celular e estrutura de conteúdo que o Google entende.",
                    itens: ["Meta tags e canonical", "Dados estruturados (Schema.org)", "Sitemap e robots.txt", "Nota 95+ no PageSpeed"],
                  },
                  {
                    sigla: "AEO",
                    nome: "Otimização para respostas",
                    desc: "Quando alguém pergunta \"quanto custa um chaveiro em Recife\", a busca responde direto na tela. Estruturamos o conteúdo em pergunta e resposta para que essa resposta seja a do seu site.",
                    itens: ["FAQ marcado com FAQPage", "Conteúdo em pergunta e resposta", "Dados do negócio explícitos", "Horário, área e serviços legíveis"],
                  },
                  {
                    sigla: "GEO",
                    nome: "Otimização para IA generativa",
                    desc: "ChatGPT, Gemini e Perplexity recomendam empresas. Para serem citados, precisam conseguir ler e confiar no seu site. Entregamos o site num formato que essas ferramentas conseguem digerir.",
                    itens: ["Arquivo llms.txt no domínio", "Descrição factual do negócio", "Conteúdo sem depender de JavaScript", "Informação consistente com o Google"],
                  },
                ].map((o, i) => (
                  <Reveal key={o.sigla} delay={i * 90} className="card port-otim-card">
                    <div className="port-otim-sigla">{o.sigla}</div>
                    <h3 className="h3" style={{ fontSize: 19, marginTop: 14 }}>{o.nome}</h3>
                    <p style={{ margin: "10px 0 0", fontSize: 14, lineHeight: 1.65, color: "var(--fg-muted)" }}>{o.desc}</p>
                    <ul className="port-otim-lista">
                      {o.itens.map((it, j) => (
                        <li key={j}>
                          <Icon name="check" size={13} color="var(--accent-bright)" strokeWidth={2.6} />
                          <span>{it}</span>
                        </li>
                      ))}
                    </ul>
                  </Reveal>
                ))}
              </div>

              <Reveal style={{ textAlign: "center", marginTop: 36 }}>
                <p style={{ margin: 0, fontSize: 14, color: "var(--fg-dim)" }}>
                  Quer conferir? O próprio site da IS7 publica o dele em{" "}
                  <a href="/llms.txt" target="_blank" rel="noreferrer" style={{ color: "var(--accent-bright)", fontFamily: "var(--mono)", fontSize: 13 }}>is7mkt.com.br/llms.txt</a>
                </p>
              </Reveal>
            </div>
          </section>

          {/* CTA */}
          <section className="port-cta">
            <div className="glow glow-blue" style={{ width: 400, height: 400, top: -120, left: "50%", transform: "translateX(-50%)", opacity: .35 }} />
            <div className="wrap" style={{ position: "relative", zIndex: 2 }}>
              <Reveal>
                <Eyebrow center>Quer um projeto assim?</Eyebrow>
                <h2 className="h2" style={{ marginTop: 16 }}>Seu negócio pode ser o <span className="grad-text">próximo case</span>.</h2>
                <p className="lead" style={{ maxWidth: 500, margin: "18px auto 0" }}>
                  Fale com a gente e descubra como sua empresa pode ter uma presença digital que vende todos os dias.
                </p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 14, justifyContent: "center", marginTop: 32 }}>
                  <a href={wa("Olá! Vi o portfólio da IS7 e quero um projeto assim também.")} target="_blank" rel="noreferrer" className="btn btn-primary btn-lg">
                    Quero meu projeto <Icon name="arrow-right" size={18} />
                  </a>
                  <a href="/#contato" className="btn btn-ghost btn-lg">Entrar em contato</a>
                </div>
              </Reveal>
            </div>
          </section>

          {/* Footer mini */}
          <footer style={{ borderTop: "1px solid var(--line)", padding: "28px 0", textAlign: "center" }}>
            <div className="wrap" style={{ display: "flex", flexWrap: "wrap", gap: 14, justifyContent: "space-between", alignItems: "center" }}>
              <Logo size={22} />
              <p style={{ margin: 0, fontSize: 12, color: "var(--fg-dim)" }}>© 2026 IS7 · Todos os direitos reservados</p>
            </div>
          </footer>

          {/* Lightbox */}
          {active && <PortfolioLightbox c={active} onClose={() => setActive(null)} />}
