<style>
  .nicho-hero{ position:relative; overflow:hidden; padding:140px 0 56px; text-align:center; }
  .nicho-provas{ display:flex; flex-wrap:wrap; gap:26px; justify-content:center; margin-top:30px; font-size:14px; color:var(--fg-muted); }
  .nicho-provas strong{ color:var(--fg); font-family:var(--serif); font-size:19px; }

  .nicho-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
  .nicho-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .nicho-card:hover{ transform:translateY(-6px); border-color:rgba(59,108,255,.45); box-shadow:0 24px 50px -22px rgba(45,110,240,.45); }

  .nicho-bar{ background:var(--surface); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .nicho-dots{ display:flex; gap:5px; flex-shrink:0; }
  .nicho-dots span{ width:10px; height:10px; border-radius:50%; display:block; }
  .nicho-url{ flex:1; background:var(--bg-2); border-radius:6px; padding:4px 10px; font-size:10px; color:var(--fg-dim); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .nicho-thumb{ height:250px; overflow:hidden; position:relative; flex-shrink:0; background:var(--surface-2); }
  .nicho-img{ position:absolute; top:0; left:0; width:100%; height:auto; display:block; transition:transform 5.5s linear; }
  @media (hover:hover){ .nicho-card:hover .nicho-img{ transform:translateY(calc(-100% + 250px)); } }
  .nicho-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(7,10,20,.55); opacity:0; transition:opacity .25s; backdrop-filter:blur(2px); }
  .nicho-card:hover .nicho-hint{ opacity:1; }

  .nicho-body{ padding:20px 22px 22px; display:flex; flex-direction:column; gap:11px; flex:1; border-top:1px solid var(--line); }
  .nicho-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .nicho-name{ margin:0; font-family:var(--serif); font-weight:700; font-size:18px; }
  .nicho-meta{ margin:4px 0 0; font-size:12.5px; color:var(--fg-dim); }
  .nicho-summary{ margin:0; font-size:14px; line-height:1.6; color:var(--fg-muted); }
  .nicho-lista{ list-style:none; margin:2px 0 0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .nicho-lista li{ display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--fg-muted); line-height:1.5; }
  .nicho-lista li svg{ margin-top:3px; flex-shrink:0; }

  .nicho-entrega{ padding:64px 0; background:var(--bg-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .nicho-entrega-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }

  .nicho-cta{ padding:70px 0; text-align:center; position:relative; background:linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }

  @media(max-width:900px){
    .nicho-grid{ grid-template-columns:1fr; gap:18px; }
    .nicho-entrega-grid{ grid-template-columns:1fr; }
    .nicho-hero{ padding:120px 0 44px; }
  }
  [data-theme="light"] .nicho-card{ box-shadow:0 2px 14px rgba(0,0,0,.07); }
  [data-theme="light"] .nicho-card:hover{ box-shadow:0 24px 50px -22px rgba(30,79,216,.20); }
</style>
